<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Генератор случайных чисел</title>
  <style>
    :root {
      --bg1: #111827;
      --bg2: #312e81;
      --panel: rgba(255, 255, 255, .11);
      --line: rgba(255, 255, 255, .18);
      --text: #f8fafc;
      --muted: #cbd5e1;
      --accent: #a78bfa;
      --accent2: #67e8f9;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 15% 20%, rgba(103, 232, 249, .22), transparent 28%),
        radial-gradient(circle at 85% 80%, rgba(167, 139, 250, .28), transparent 32%),
        linear-gradient(135deg, var(--bg1), var(--bg2));
    }

    .app {
      width: min(100%, 530px);
      padding: clamp(24px, 6vw, 42px);
      border: 1px solid var(--line);
      border-radius: 28px;
      background: var(--panel);
      box-shadow: 0 24px 70px rgba(0, 0, 0, .36);
      backdrop-filter: blur(18px);
    }

    h1 { margin: 0; font-size: clamp(1.7rem, 5vw, 2.25rem); letter-spacing: -.04em; }
    .lead { margin: 10px 0 28px; color: var(--muted); }

    .inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    label { display: grid; gap: 8px; color: var(--muted); font-size: .9rem; font-weight: 600; }

    input {
      width: 100%;
      padding: 14px 12px;
      border: 1px solid var(--line);
      border-radius: 13px;
      outline: none;
      color: var(--text);
      background: rgba(15, 23, 42, .45);
      font: inherit;
      font-size: 1.05rem;
    }

    input:focus { border-color: var(--accent2); box-shadow: 0 0 0 3px rgba(103, 232, 249, .16); }

    .result {
      display: grid;
      place-items: center;
      min-height: 180px;
      margin: 24px 0 18px;
      border: 1px solid rgba(255, 255, 255, .12);
      border-radius: 22px;
      background: rgba(15, 23, 42, .28);
      overflow: hidden;
    }

    #number {
      font-size: clamp(4rem, 17vw, 7rem);
      font-weight: 800;
      line-height: 1;
      letter-spacing: -.07em;
      color: var(--accent2);
      text-shadow: 0 0 32px rgba(103, 232, 249, .35);
    }

    .roll { animation: roll .46s cubic-bezier(.2, .75, .2, 1); }
    @keyframes roll { 0% { opacity: .15; transform: scale(.72) rotate(-8deg); } 65% { transform: scale(1.12) rotate(2deg); } 100% { opacity: 1; transform: scale(1); } }

    button {
      width: 100%;
      padding: 15px 18px;
      border: 0;
      border-radius: 14px;
      cursor: pointer;
      color: #17112f;
      background: linear-gradient(135deg, var(--accent2), var(--accent));
      font: inherit;
      font-weight: 800;
      font-size: 1rem;
      transition: transform .18s ease, filter .18s ease;
    }

    button:hover { filter: brightness(1.08); transform: translateY(-2px); }
    button:active { transform: translateY(0) scale(.98); }

    .message { min-height: 22px; margin: 14px 0 0; text-align: center; color: var(--muted); font-size: .9rem; }
    .message.error { color: #fda4af; }

    .history-title { margin: 28px 0 10px; color: var(--muted); font-size: .84rem; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; }
    #history { display: flex; flex-wrap: wrap; gap: 8px; min-height: 30px; }
    .chip { padding: 6px 10px; border: 1px solid var(--line); border-radius: 999px; background: rgba(255, 255, 255, .07); font-variant-numeric: tabular-nums; }

    @media (max-width: 390px) { .inputs { grid-template-columns: 1fr; } .app { border-radius: 22px; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <main class="app">
    <h1>Генератор чисел</h1>
    <h2 >Создано SandeoCHIZAS</h2>
    <p class="lead">Укажите диапазон — и получите случайное целое число.</p>

    <div class="inputs">
      <label for="min">От
        <input id="min" type="number" value="1" step="1" inputmode="numeric">
      </label>
      <label for="max">До
        <input id="max" type="number" value="100" step="1" inputmode="numeric">
      </label>
    </div>

    <section class="result" aria-live="polite" aria-label="Сгенерированное число">
      <span id="number">—</span>
    </section>

    <button id="generate" type="button">Сгенерировать число</button>
    <p id="message" class="message">Диапазон: от 1 до 100</p>

    <p class="history-title">Последние результаты</p>
    <div id="history" aria-live="polite"></div>
  </main>

  <script>
    const minInput = document.getElementById('min');
    const maxInput = document.getElementById('max');
    const number = document.getElementById('number');
    const button = document.getElementById('generate');
    const message = document.getElementById('message');
    const history = document.getElementById('history');
    const results = [];

    function readRange() {
      const min = Number(minInput.value);
      const max = Number(maxInput.value);
      if (!Number.isInteger(min) || !Number.isInteger(max)) {
        throw new Error('Введите два целых числа.');
      }
      if (min > max) {
        throw new Error('Число «От» не может быть больше числа «До».');
      }
      return { min, max };
    }

    function randomInteger(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function updateRangeHint() {
      try {
        const { min, max } = readRange();
        message.textContent = `Диапазон: от ${min} до ${max}`;
        message.classList.remove('error');
      } catch (error) {
        message.textContent = error.message;
        message.classList.add('error');
      }
    }

    function renderHistory() {
      history.replaceChildren(...results.map(value => {
        const item = document.createElement('span');
        item.className = 'chip';
        item.textContent = value;
        return item;
      }));
    }

    function generate() {
      try {
        const { min, max } = readRange();
        const value = randomInteger(min, max);
        number.textContent = value;
        number.classList.remove('roll');
        void number.offsetWidth;
        number.classList.add('roll');
        results.unshift(value);
        results.splice(8);
        renderHistory();
        message.textContent = `Готово! Выпало число ${value}.`;
        message.classList.remove('error');
      } catch (error) {
        message.textContent = error.message;
        message.classList.add('error');
      }
    }

    button.addEventListener('click', generate);
    [minInput, maxInput].forEach(input => {
      input.addEventListener('input', updateRangeHint);
      input.addEventListener('keydown', event => { if (event.key === 'Enter') generate(); });
    });
  </script>
</body>
</html>
